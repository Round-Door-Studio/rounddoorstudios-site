name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'f3/**']

jobs:
  lint-and-unit:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

  e2e:
    name: E2E Tests (Playwright) — Shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Write .env.local
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_FREE_EMAIL: ${{ secrets.TEST_USER_FREE_EMAIL }}
          TEST_USER_FREE_PASSWORD: ${{ secrets.TEST_USER_FREE_PASSWORD }}
          TEST_USER_PURCHASER_EMAIL: ${{ secrets.TEST_USER_PURCHASER_EMAIL }}
          TEST_USER_PURCHASER_PASSWORD: ${{ secrets.TEST_USER_PURCHASER_PASSWORD }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "TEST_USER_EMAIL=$TEST_USER_EMAIL"
            echo "TEST_USER_PASSWORD=$TEST_USER_PASSWORD"
            echo "TEST_USER_FREE_EMAIL=$TEST_USER_FREE_EMAIL"
            echo "TEST_USER_FREE_PASSWORD=$TEST_USER_FREE_PASSWORD"
            echo "TEST_USER_PURCHASER_EMAIL=$TEST_USER_PURCHASER_EMAIL"
            echo "TEST_USER_PURCHASER_PASSWORD=$TEST_USER_PURCHASER_PASSWORD"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } > .env.local

      - name: Build
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
